[package]
name = "vc-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "vc_ffi"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = []
sim = []

[dependencies]
vc-core = { path = "../vc-core" }
vc-efficacy = { path = "../vc-efficacy" }
vc-gatt = { path = "../vc-gatt" }
vc-report = { path = "../vc-report" }
vc-sim = { path = "../vc-sim" }
heapless = { workspace = true }
uniffi = "=0.32.2"

[dev-dependencies]
vc-core = { path = "../vc-core", features = ["testkit"] }
