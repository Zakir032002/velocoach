# XcodeGen spec for the coach app. scripts/setup-ios.sh runs `xcodegen generate` here and
# writes VeloCoach.xcodeproj (not committed: regenerate instead of merging project files).
name: VeloCoach
options:
  bundleIdPrefix: dev.zakir.velocoach
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  VcCore:
    path: VcCore
settings:
  base:
    DEVELOPMENT_TEAM: 42H9VCQ78N # Zakir's personal team (free: 7-day profiles)
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  VeloCoach:
    type: application
    platform: iOS
    sources:
      - path: VeloCoach
        excludes:
          - Info.plist
      # The rendered cue bank (earcon + speech per cue variant, manifest.json), bundled as a
      # folder reference named "cues". Made by scripts/render_cues.sh.
      - path: ../../assets/cues
        type: folder
        buildPhase: resources
    dependencies:
      - package: VcCore
    info:
      path: VeloCoach/Info.plist
      properties:
        CFBundleDisplayName: VeloCoach
        NSBluetoothAlwaysUsageDescription: VeloCoach connects to your sensors over Bluetooth.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Info.plist keys, not entitlements: allowed on a free personal team. If signing ever
        # rejects them, delete these two lines and keep the app in the foreground while riding.
        UIBackgroundModes: [bluetooth-central, audio]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.zakir.velocoach.coach
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
schemes:
  VeloCoach:
    build:
      targets:
        VeloCoach: all
    run:
      config: Debug
