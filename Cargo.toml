[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
heapless = "0.9.3"
proptest = "1"
libm = "0.2" # the purpose of this is to grant us mathematical functions like exp in the no_std 
anyhow = "1"
serde = { version = "1", features = ["derive"] }

[profile.dev]
debug = "line-tables-only"
